name: CPU regression

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpu-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          lfs: false
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            requirements-data.txt
            .github/workflows/tests.yml
      - name: Install CPU test environment
        run: |
          python -m pip install pip==24.0 setuptools==69.0.3 wheel==0.42.0
          python -m pip install torch==2.1.2 torchaudio==2.1.2 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-ci.txt
          python -m pip check
      - name: Run lightweight regression suite
        run: python -m pytest -q --junitxml=reports/ci-cpu/junit.xml
      - name: Check Python syntax
        run: python -m compileall -q main.py t2l scripts tests
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cpu-regression-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/ci-cpu/junit.xml
          if-no-files-found: warn
          retention-days: 7
